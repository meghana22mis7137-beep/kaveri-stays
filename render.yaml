services:
  - type: web
    name: kaveri-stays
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kaveri-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: kaveri-db
    plan: free
    databaseName: kaveri
    user: kaveri_user
